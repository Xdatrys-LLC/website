<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My account · Xdatrys</title><meta name="description" content="Sign in to Xdatrys or manage your membership."><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<style>
:root{--mag:#E100FF;--cyan:#00D4FF;--bg:#09090f;--card:#15151f;--line:rgba(255,255,255,.12);--soft:#a9a9b8;--ok:#3ddc84;--warn:#ffb02e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#ececf3;font-family:Montserrat,Inter,system-ui,-apple-system,sans-serif;line-height:1.55}
main{max-width:760px;margin:0 auto;padding:36px 16px 70px}h1{font-size:clamp(26px,5vw,38px);margin:0 0 10px;line-height:1.2}
h2{font-size:20px;margin:30px 0 8px}p,li{font-size:16px}a{color:var(--cyan)}.soft{color:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:18px 0}
.btn{display:inline-block;border:0;border-radius:10px;padding:14px 22px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit}
.btn.go{background:var(--mag);color:#fff}.btn.alt{background:transparent;color:#fff;border:1px solid var(--line)}.btn[disabled]{opacity:.5;cursor:wait}
input[type=email]{width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:#0d0d14;color:#fff;font-size:16px;margin:8px 0 12px}
.test{background:#2a2108;border:1px solid var(--warn);color:#ffe2a8;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:18px}
.draft{background:#2a0b2e;border:1px solid var(--mag);color:#f5c6ff;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:18px}
.toggle{display:inline-flex;background:#0d0d14;border:1px solid var(--line);border-radius:999px;padding:4px;margin:6px 0 16px}
.toggle button{border:0;background:none;color:var(--soft);padding:9px 18px;border-radius:999px;font-weight:700;font-family:inherit;cursor:pointer;font-size:14px}
.toggle button.on{background:#fff;color:#111}.price{font-size:34px;font-weight:800}.price small{font-size:15px;color:var(--soft);font-weight:600}
ul.feat{padding-left:20px}ul.feat li{margin:6px 0}.msg{min-height:1.4em;font-weight:600;margin-top:10px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}dt{color:var(--soft)}dd{margin:0;font-weight:600}
</style></head><body>
<main>
<div class="test" id="test" style="display:none"><b>Test mode.</b> No real money is taken. To try it, use Stripe's test card
<b>4242 4242 4242 4242</b>, any future expiry date, any 3-digit code and any postcode.</div>
<h1 id="h">My account</h1>
<div id="out"><p class="soft">Loading…</p></div>

<p class="soft" style="margin-top:40px;font-size:14px"><a href="/terms/">Terms</a> · <a href="/refunds/">Refunds</a> · <a href="/privacy/">Privacy</a> · Xdatrys LLC, 44 Rue Pasquier, 75008 Paris, France</p>
</main>
<script>
const $ = id => document.getElementById(id);
if (/\.pages\.dev$/.test(location.hostname) && $("test")) $("test").style.display = "block";
</script>
<script>
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const q = new URLSearchParams(location.search), next = q.get("next") || "/account/";
const day = s => new Date(s * 1000).toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" });
const STATUS = { active: "Active", trialing: "Active", past_due: "Payment problem: Stripe will try your card again", canceled: "Ended", unpaid: "Ended (unpaid)", incomplete: "Payment not finished" };
async function portal(btn) {
  btn.disabled = true;
  try { const j = await (await fetch("/api/stripe/portal", { method: "POST" })).json(); if (j.url) { location.href = j.url; return; } alert(j.error); } catch (e) { alert("No connection."); }
  btn.disabled = false;
}
window.portal = portal;
const signout = `<form method="post" action="/api/auth/signout" style="display:inline"><button class="btn alt">Sign out</button></form>`;
function signinForm(me) {
  $("h").textContent = "Sign in";
  const off = !me.emailsOn;
  $("out").innerHTML = `<div class="card">
    <p>Type the email address you joined with. We'll email you a link: tap it and you're signed in. No password needed.</p>
    <input type="email" id="em" autocomplete="email" placeholder="you@example.com" aria-label="Email address">
    <input type="text" id="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
    <button class="btn go" id="send" style="width:100%" ${off ? "disabled" : ""}>Email me a sign-in link</button>
    <div class="msg" id="msg">${off ? "Sign-in by email opens soon. If you just joined, you are already signed in on the phone or computer you paid on." : ""}</div></div>
    ${q.get("owner") ? `<p class="soft">The review and correction maps are for the owner: open your owner sign-in link on this device.</p>` : ""}
    <p>Not a member yet? <a href="/join/">Join Explorer</a> · Free without joining: 3 spots on every map in the <a href="/library/">Map Library</a>.</p>`;
  if (off) return;
  $("send").onclick = async () => {
    const em = $("em").value.trim(); if (!em) { $("msg").textContent = "Please type your email address."; return; }
    $("send").disabled = true; $("msg").textContent = "Sending…";
    try {
      const j = await (await fetch("/api/auth/request", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ email: em, next, website: $("website").value }) })).json();
      $("msg").textContent = j.message || j.error;
    } catch (e) { $("msg").textContent = "No connection. Please try again."; }
    $("send").disabled = false;
  };
}
fetch("/api/me", { cache: "no-store" }).then(r => r.json()).then(me => {
  if (!me.signedIn) return signinForm(me);
  if (me.role === "owner") {
    $("out").innerHTML = `<div class="card"><p><b>Owner access</b> on this device: every map, all spots, and the review and correction maps.</p>
      <div class="row"><a class="btn go" href="/app/">Open the app</a><a class="btn alt" href="/review/">Review maps</a>${signout}</div></div>`;
    return;
  }
  const active = me.role === "member";
  const plan = me.plan === "explorer" ? "Explorer" : (me.plan || "Membership");
  const when = me.paidUntil ? day(me.paidUntil) : "";
  $("out").innerHTML = `<div class="card"><dl>
      <dt>Signed in as</dt><dd>${esc(me.email)}</dd>
      <dt>Plan</dt><dd>${esc(plan)}${me.interval ? (me.interval === "year" ? " (yearly)" : " (monthly)") : ""}</dd>
      <dt>Status</dt><dd>${esc(STATUS[me.status] || me.status || "No membership")}</dd>
      ${when ? `<dt>${me.cancelAtEnd || !active ? "Access until" : "Next payment"}</dt><dd>${when}</dd>` : ""}</dl>
      ${me.cancelAtEnd && active ? `<p class="soft">Your membership is cancelled and ends on ${when}. You can restart it from Manage.</p>` : ""}
      <div class="row">${active ? `<a class="btn go" href="/app/">Open the app</a>` : `<a class="btn go" href="/join/">Join again</a>`}
      ${me.canManage ? `<button class="btn alt" onclick="portal(this)">Manage or cancel</button>` : ""}${signout}</div></div>
      <p class="soft">Manage opens Stripe's secure page: change monthly/yearly, update your card, see invoices, or cancel.</p>`;
}).catch(() => { $("out").innerHTML = `<p>No connection. Please reload.</p>`; });
</script>
</body></html>
